# ============================================================
# CodeRouter providers.yaml — 外部コーディングエージェント CLI (agent_cli)
# 【カテゴリ】 kind="agent_cli" アダプタ / Phase 1 完了 — claude (1a)・codex (1b)・
#              antigravity (1c)・grok (1d) の4バックエンドすべて実装済み
#              / agent_cli plugin 切り出し Phase 2c 完了(v2.9.0) —
#              in-core アダプタは削除済み。kind: agent_cli を使うには
#              coderouter-plugin-agents のインストール +
#              plugins.enabled: [agents] が必須 (破壊的変更。下記
#              plugins: ブロックと「使い方」節を参照)。
#
# 出典: docs/designs/external-agents-adapter.md,
#       docs/designs/agent-cli-plugin-extraction.md
# 目的: Claude Code CLI (`claude -p --output-format json`)、Codex CLI、
#       Antigravity CLI (`agy`)、Grok CLI を CodeRouter の1プロバイダとして
#       登録し、他のオーケストレータ (別の Claude Code / Cursor 等) から
#       「1つのモデル」として透過的に呼び出せるようにする。
#       CodeRouter はワンショット exec (プロンプト in → テキスト out) の
#       1変換だけを担い、エージェントのマルチターン制御ループそのものは
#       中で完結させる (future.md の「1リクエスト=1変換」思想を維持)。
#
# 実装スコープ (v2.7.10 時点 — Phase 1 完了):
#   - agent: claude (Phase 1a)・codex (Phase 1b)・antigravity (Phase 1c)・
#     grok (Phase 1d) の4つすべてが実装済み。いずれもサブスクリプション
#     OAuth を優先し (claude: `~/.claude/.credentials.json` または
#     `claude setup-token`、codex: `~/.codex/auth.json`、antigravity:
#     OS キーリング + `~/.gemini/antigravity-cli/`、grok:
#     `~/.grok/auth.json`)、子プロセスには ANTHROPIC_API_KEY 等を含む
#     親環境を継承させない (env allowlist、下記 passthrough_env 参照)。
#   - agent: gemini は config スキーマ上は宣言できるが、Google が
#     2026年6月に個人アカウント向け Gemini CLI 提供を終了したため、
#     アダプタ構築時に必ず専用メッセージ付きの AdapterError で拒否される:
#       AdapterError: Google discontinued Gemini CLI for individual
#       accounts (June 2026). Use agent='antigravity' instead.
#     後継の antigravity ブロックを下記に用意してある(末尾の参考節も参照)。
#   - 既定は read_only (書き込み不可)。書き込みを許可するには
#     allow_file_writes: true と sandbox_mode: edit|full_auto を両方
#     明示する必要がある (片方だけだと config load 時に ValueError)。
#   - streaming は native ではなく擬似ストリーム (最終回答を分割して
#     yield するだけ) なので capabilities.streaming: false を明示する
#     (既定 true のため上書き必須)。
#
# 使い方:
#   1. coderouter-plugin-agents をインストールする (v2.9.0 以降必須。
#      未実施だと下記 provider 群がある状態で `coderouter serve` が
#      起動時エラーで止まる):
#        uv pip install "coderouter-plugin-agents @ git+https://github.com/zephel01/coderouter-plugin-agents"
#        # または pip install "coderouter-plugin-agents @ git+https://github.com/zephel01/coderouter-plugin-agents"
#        # uv tool install 構成の場合は同じツール環境に同居させる:
#        #   uv tool install coderouter-t \
#        #     --with "coderouter-plugin-agents @ git+https://github.com/zephel01/coderouter-plugin-agents"
#      このファイルには下記に `plugins: enabled: [agents]` を既に
#      含めてある (二段ゲート — インストールしただけでは有効にならない)。
#   2. claude CLI がインストール済み・`claude` が PATH 上にあること
#      (`claude --version` で確認)。
#   3. サブスクリプション認証を済ませておく (`claude` を対話起動して
#      ログイン、または `claude setup-token` で1年トークンを発行し
#      CLAUDE_CODE_OAUTH_TOKEN として環境変数に設定)。
#   4. cp examples/providers-agent-cli.yaml ~/.coderouter-t/providers.yaml
#   5. coderouter serve --port 8088
#   6. 動作確認:
#        curl http://localhost:8088/v1/chat/completions \
#          -H 'Content-Type: application/json' \
#          -H 'X-CodeRouter-Profile: claude-agent' \
#          -d '{"model":"opus","messages":[{"role":"user","content":"1行でこんにちはと言って"}]}'
#      下記の codex ブロックを有効化した場合の動作確認 (要 `codex login` 済み):
#        curl http://localhost:8088/v1/chat/completions \
#          -H 'Content-Type: application/json' \
#          -H 'X-CodeRouter-Profile: codex' \
#          -d '{"model":"gpt-5.5","messages":[{"role":"user","content":"1行でこんにちはと言って"}]}'
#      下記の antigravity ブロックを有効化した場合の動作確認 (要 `agy` の
#      初回ログイン済み):
#        curl http://localhost:8088/v1/chat/completions \
#          -H 'Content-Type: application/json' \
#          -H 'X-CodeRouter-Profile: antigravity' \
#          -d '{"model":"Gemini 3.5 Flash (Low)","messages":[{"role":"user","content":"1行でこんにちはと言って"}]}'
#      下記の grok ブロックを有効化した場合の動作確認 (要 `grok login` 済み):
#        curl http://localhost:8088/v1/chat/completions \
#          -H 'Content-Type: application/json' \
#          -H 'X-CodeRouter-Profile: grok' \
#          -d '{"model":"grok-4.5","messages":[{"role":"user","content":"1行でこんにちはと言って"}]}'
#
# 注意: この例は claude をサブスクリプション OAuth で使う前提のため
#   paid: false としている (従量課金が発生しない経路。サブスクの
#   5時間窓/週次クォータは消費する)。API キー従量課金で運用する
#   場合は paid: true に変え、ALLOW_PAID=true で起動すること
#   (環境変数 ALLOW_PAID は yaml の allow_paid を上書きする点に注意)。
# ============================================================

default_profile: claude-agent

# v2.9.0 以降必須: kind: agent_cli の provider を使うには
# coderouter-plugin-agents をインストールした上で、ここに "agents" を
# 列挙して有効化する必要がある (二段ゲート)。インストールコマンド:
#   uv pip install "coderouter-plugin-agents @ git+https://github.com/zephel01/coderouter-plugin-agents"
#   # または: pip install "coderouter-plugin-agents @ git+https://github.com/zephel01/coderouter-plugin-agents"
#   # uv tool install 構成なら:
#   #   uv tool install coderouter-t \
#   #     --with "coderouter-plugin-agents @ git+https://github.com/zephel01/coderouter-plugin-agents"
# 未インストール/未列挙のままだと coderouter serve は起動時エラーで
# 停止する (docs/backends/external-agents.md のトラブルシューティング参照)。
plugins:
  enabled: [agents]

providers:
  # ---- Claude Code CLI (Phase 1a・実装済み) ----
  - name: agent-claude
    kind: agent_cli
    model: opus                  # CLI へ渡す --model 値 (opus|sonnet|haiku|fable)
    paid: false                  # サブスク OAuth 運用 = 従量課金ゼロ (上記ヘッダ参照)
    timeout_s: 30                # HTTP 層の既定値。agent_cli では使われない
                                  # (exec の強制タイムアウトは exec_timeout_s の方)
    capabilities:
      streaming: false            # 既定 true のため明示上書き必須 (擬似ストリームのみ)
      tools: false                 # エージェント内部でツールを使うが CodeRouter の
                                    # ワイヤ上は往復しない (§7)
    agent_cli:
      agent: claude
      command: claude            # PATH 解決。絶対パスも可
      workdir: ~/.coderouter-t/agents/claude
      exec_timeout_s: 600         # ワンショット exec の強制タイムアウト (秒)
      allow_file_writes: false    # 既定 read-only (書き込みには明示 opt-in が必要)
      sandbox_mode: read_only     # --permission-mode plan にマップされる
      max_turns: 8                # CLI 内部のターン上限 (--max-turns)
      passthrough_env: [CLAUDE_CODE_OAUTH_TOKEN]   # setup-token を使う場合のみ (任意)
      agent_depth_limit: 2         # ネスト再帰 (CODEROUTER_AGENT_DEPTH) の上限

  # ---- OpenAI Codex CLI (Phase 1b・実装済み — v2.7.9) ----
  # 実装済みだが既定ではコメントアウトしてある: このファイルをそのまま
  # コピーしても codex CLI のインストールを要求しないようにするため。
  # codex CLI (0.144.1 で検証) を導入し `codex login` を済ませてから
  # 有効化すること (`codex login status` が exit 0 を返せば認証 OK)。
  # pre-1.0・ほぼ毎日リリースのためバージョン pin 推奨 (command にフルパス指定可)。
  #
  # 認証: ChatGPT プランサブスクリプション OAuth (`~/.codex/auth.json` または
  #   OS キーチェーン、約8日で stale・使用時自動リフレッシュ)。CI で API
  #   キー従量課金を使う場合のみ CODEX_API_KEY (exec専用) または
  #   OPENAI_API_KEY を passthrough_env に列挙する。CODEX_HOME で
  #   config/資格情報ディレクトリを上書き可能。
  # max_turns: codex には対応する CLI フラグが無いため常に無視される。
  #   時間上限は exec_timeout_s (+ プロセスグループ kill) のみが担う。
  # サンドボックス: codex exec には承認フラグ (-a/--ask-for-approval) が
  #   存在しない (非対話実行のため)。edit/full_auto はいずれも
  #   -s workspace-write に写る (claude の acceptEdits と同様、両者は
  #   区別されない)。
  #
  # - name: agent-codex
  #   kind: agent_cli
  #   model: gpt-5.5                # 現行フロンティアモデルの例。既定モデルは
  #                                  # 環境/プラン依存のため明示推奨
  #   paid: false                   # ChatGPT プランサブスクリプション OAuth 運用 = 従量課金ゼロ
  #   capabilities:
  #     streaming: false
  #     tools: false
  #   agent_cli:
  #     agent: codex
  #     command: codex
  #     workdir: ~/.coderouter-t/agents/codex
  #     exec_timeout_s: 600
  #     allow_file_writes: false
  #     sandbox_mode: read_only     # -s read-only にマップ
  #     max_turns: 8                # codex では無視される (上記コメント参照)
  #     passthrough_env: []         # OAuth は ~/.codex/auth.json を HOME 継承で読むため空でよい。
  #                                  # CI で API キーを使う場合のみ CODEX_API_KEY (exec専用)
  #                                  # または OPENAI_API_KEY を列挙する
  #
  # 有効化する場合は profiles にも次を追加する:
  #   - name: codex
  #     providers: [agent-codex]

  # ---- Google Antigravity CLI (Phase 1c・実装済み — v2.7.10) ----
  # 実装済みだが既定ではコメントアウトしてある: このファイルをそのまま
  # コピーしても agy のインストールを要求しないようにするため。
  # Antigravity CLI (コマンド名 `agy`。gemini-cli のフォークではない
  # 別実装、agy 1.1.1 で検証) を導入し、初回 `agy` 実行でブラウザの
  # Google アカウントログインを済ませてから有効化すること
  # (`agy models` が一覧を返せば認証 OK)。
  # 当初計画されていた agent: gemini は Google が2026年6月に個人
  # アカウント向け提供を終了したため、後継の antigravity として
  # Phase 1c を実装した。agent: gemini は config スキーマには残るが
  # 実行すると専用メッセージ付きの AdapterError で拒否される
  # (詳細はファイル冒頭のコメント、および docs/backends/external-agents.md
  # を参照)。early-days プロダクトのためバージョン pin 推奨
  # (command にフルパス指定可)。
  #
  # プロンプト投入: agy には stdin 経由のプロンプト受け取りも
  #   --prompt-file 相当のフラグも無いため、プロンプトは argv の値
  #   (`-p <prompt>`) として渡すほかない。Linux の MAX_ARG_STRLEN
  #   (約128KiB) の上限と `ps` でのプロンプト可視性が既知の制限として
  #   残る (claude/codex は stdin、grok は --prompt-file を使うため
  #   この制限を受けない)。
  # stdin 注意: agy に stdin をパイプすると応答がハングすることが
  #   実機で確認されている。アダプタは stdin に何も書かず即クローズ
  #   するため CodeRouter 経由では問題にならないが、agy を直接
  #   スクリプトで叩く場合は stdin を空にする (</dev/null 等) こと。
  # 出力: --output-format 系のフラグが無くプレーンテキストのみのため、
  #   トークン usage・セッション ID は取得不能。usage は常にゼロ報告
  #   (cost も ProviderConfig.cost に単価を設定しない限り 0 のまま)。
  # max_turns: agy には対応する CLI フラグが無いため常に無視される
  #   (codex と同様)。
  # タイムアウト: agy は --print-timeout という CLI 側タイムアウトを
  #   持つ唯一のエージェント。exec_timeout_s から生成し、外側の
  #   asyncio.wait_for + プロセスグループ kill と合わせて二重防壁になる。
  # モデル名: API ID ではなく表示名文字列 (`agy models` で一覧)。
  #   Claude Opus 4.6 (Thinking) 等、Google 以外のモデルまで呼べる。
  # 認証: Google アカウント OAuth (無料枠可)。資格情報は OS キーリング
  #   優先 + ~/.gemini/antigravity-cli/ (credentials.enc / settings.json)。
  #   HOME (macOS では USER も) 継承で headless 動作するため
  #   passthrough_env: [] でよい。API キー経由の環境変数名は情報が
  #   錯綜しており未確認 (UNCONFIRMED) — 断定しない。
  #
  # - name: agent-antigravity
  #   kind: agent_cli
  #   model: "Gemini 3.5 Flash (Low)"   # 表示名文字列。`agy models` で一覧確認
  #   paid: false                        # Google アカウント OAuth 運用(無料枠含む) = 従量課金ゼロ
  #   capabilities:
  #     streaming: false
  #     tools: false
  #   agent_cli:
  #     agent: antigravity
  #     # command は省略可 (既定 "agy" — バイナリ名が製品名と異なる)
  #     workdir: ~/.coderouter-t/agents/antigravity
  #     exec_timeout_s: 600
  #     allow_file_writes: false
  #     sandbox_mode: read_only     # --mode plan にマップ
  #     max_turns: 8                # antigravity では無視される (上記コメント参照)
  #     passthrough_env: []         # OAuth は OS キーリング + ~/.gemini/antigravity-cli/ を
  #                                  # HOME 継承で読むため空でよい。API キー env は UNCONFIRMED
  #
  # 有効化する場合は profiles にも次を追加する:
  #   - name: antigravity
  #     providers: [agent-antigravity]

  # ---- xAI Grok CLI (Phase 1d・実装済み — v2.7.8) ----
  # 実装済みだが既定ではコメントアウトしてある: このファイルをそのまま
  # コピーしても grok CLI のインストールを要求しないようにするため。
  # grok CLI (v0.2.93 [stable] で検証) を導入し `grok login` を済ませて
  # から有効化すること (`grok models` が通れば認証 OK)。
  # early beta のためバージョン pin 推奨 (command にフルパス指定可)。
  #
  # 認証: OAuth サブスクリプションログイン対応 (SuperGrok / X Premium+、
  #   資格情報は ~/.grok/auth.json・7日失効・自動リフレッシュ)。かつての
  #   「grok は API 課金必須 (サブスク非対応)」という前提は Grok Build
  #   beta (2026-05) 以降 obsolete。
  # usage/cost: grok の JSON 出力にはトークン usage / コストのフィールドが
  #   無いため usage はゼロ報告、cost も ProviderConfig.cost に単価を
  #   設定しない限り 0 のまま。
  #
  # - name: agent-grok
  #   kind: agent_cli
  #   model: grok-4.5              # 現行の既定モデル (`grok models` で一覧)
  #   paid: false                  # サブスク OAuth 運用 = 従量課金ゼロ
  #   capabilities:
  #     streaming: false
  #     tools: false
  #   agent_cli:
  #     agent: grok
  #     command: grok
  #     workdir: ~/.coderouter-t/agents/grok
  #     exec_timeout_s: 600
  #     allow_file_writes: false
  #     sandbox_mode: read_only    # --sandbox read-only --permission-mode plan にマップ
  #     max_turns: 8               # --max-turns
  #     passthrough_env: []        # OAuth は ~/.grok/auth.json を HOME 継承で読むため空でよい。
  #                                # CI で API キーを使う場合のみ GROK_CODE_XAI_API_KEY を
  #                                # 列挙する (XAI_API_KEY ではない点に注意。転送時は
  #                                # OAuth より優先される)
  #
  # 有効化する場合は profiles にも次を追加する:
  #   - name: grok
  #     providers: [agent-grok]
  #
  # 補足: Grok の公式 API は OpenAI 互換なので、CLI を経由しない
  #   kind: openai_compat + base_url: https://api.x.ai/v1 という代替経路も
  #   引き続き有効 (docs/designs/external-agents-adapter.md §9.2)。

profiles:
  # claude-agent — Claude Code CLI 専用プロファイル。単独 (fallback なし)。
  # agent_cli は「プロンプト in → テキスト out」の不透明なテキスト
  # バックエンドなので、ツール往復を期待する chain の途中には挟まない
  # (§7 配置方針)。
  - name: claude-agent
    providers:
      - agent-claude

# model 名でも到達可能にしたい場合の例 (任意):
# auto_router:
#   rules:
#     - id: user:route-claude-agent
#       profile: claude-agent
#       match: { model_pattern: "claude-agent.*" }

# ============================================================
# 参考: agent: gemini は書けるが常に拒否される
#
# 当初計画されていた Phase 1c は Google Gemini CLI (コマンド `gemini`)
# を対象としていたが、Google が2026年6月に個人アカウント向け提供を
# 終了したため実装対象から外れ、後継の Antigravity CLI (`agy`) を
# 対象に agent: antigravity として実装された (上記参照)。
#
# agent: gemini は config スキーマの Literal には残っているため
# 次のような設定は providers.yaml として "読み込める" が、
# AgentCliAdapter の構築時に必ず次の専用メッセージで拒否される
# (retryable=False):
#   AdapterError: Google discontinued Gemini CLI for individual
#   accounts (June 2026). Use agent='antigravity' instead.
#
# 詳細: docs/backends/external-agents.md の「gemini の廃止と
# antigravity への移行」節、docs/designs/external-agents-adapter.md §11.5
# ============================================================

# providers:
#   - name: agent-gemini
#     kind: agent_cli
#     agent_cli:
#       agent: gemini   # → 上記 AdapterError で拒否される。
#                        #   agent: antigravity に置き換えること。
