# ============================================================
# CodeRouter providers.yaml — llama.cpp / vLLM ローカル推論サンプル
# 【カテゴリ】 llama.cpp / vLLM ＋ Launcher（Ollama 不要）
#
# ★ 2026-08 更新: llama.cpp の自動メモリフィット体系に全面対応 ★
#   -fit (自動メモリフィット) は PR #16653 / b7410 (2025-12-15) から **既定 on** です。
#   「-ngl 99 -c 8192 -fa on」をコピペする従来のテンプレは、この自動調整を
#   **丸ごと停止させる** ため、むしろ遅く・OOM しやすくなります。
#   このファイルは「基本は書かない、足りないときだけ足す」方針で書き直しています。
#   b7410 (2025-12-15) 以前の llama.cpp では -fit 系が無いため起動に失敗します。
#
# このファイルは以下を想定した最小構成です:
#   - llama.cpp (llama-server) でモデルを起動
#   - または vllm でモデルを起動
#   - Launcher UI (/launcher) で起動・管理
#
# 使い方:
#   1. cp examples/providers.llamacpp-vllm.yaml ~/.coderouter-t/providers.yaml
#   2. 必要に応じてパス・ポートを編集
#   3. coderouter serve
#   4. http://localhost:8088/launcher でモデルを起動
#   5. 起動後は自動的に CodeRouter がルーティングを引き受ける
#
# ============================================================

# ── プロバイダ定義 ────────────────────────────────────────────────────────────
#
# Launcher で起動したサーバーを CodeRouter のプロバイダとして登録します。
# ポート番号は /launcher の Launch フォームで指定したものと合わせてください。

providers:
  # llama.cpp (llama-server) を 8080 で起動した場合
  - name: llama-cpp-local
    kind: openai_compat
    base_url: http://localhost:8080/v1
    model: ""            # llama-server は model 名を気にしないので空 or ファイル名ベースで OK
    timeout_s: 120

  # vllm を 8081 で起動した場合
  - name: vllm-local
    kind: openai_compat
    base_url: http://localhost:8081/v1
    model: ""            # vllm: --model に渡したモデル名 or HuggingFace repo ID を記入
    timeout_s: 120

# ── プロファイル定義 ──────────────────────────────────────────────────────────

profiles:
  # llama.cpp のみ使うプロファイル
  - name: local-llama
    providers: [llama-cpp-local]

  # vllm のみ使うプロファイル
  - name: local-vllm
    providers: [vllm-local]

  # llama.cpp をメイン、vllm をフォールバックにするプロファイル
  - name: default
    providers: [llama-cpp-local, vllm-local]

default_profile: default

# ── Launcher 設定 ─────────────────────────────────────────────────────────────
#
# /launcher UI でモデルを起動するための設定です。
# ここで定義したオプションプロファイルが Launch フォームのドロップダウンに表示されます。

launcher:

  # モデルファイルのスキャン対象ディレクトリ
  # .gguf / .safetensors / .bin / .pt / .ggml を再帰的に検索します
  model_dirs:
    - ~/models
    # - ~/Downloads
    # - /Volumes/External/gguf

  # バイナリパス設定 (PATH に入っている場合は省略可)
  backends:
    llama.cpp:
      binary: null          # null = PATH の llama-server を使用
      # binary: ~/llama.cpp/build/bin/llama-server   # ソースビルド例
    vllm:
      binary: null          # null = PATH の python を使用
      # binary: ~/.venv/bin/python                    # venv 例

    # ── 特化ビルドの切り替え (v2.11.0+) ────────────────────────────────
    # llama.cpp を GPU ランタイム別にビルドしてあるなら、"<基底名>-<バリアント>"
    # のキーで登録すると「バックエンド」セレクトに増え、起動ごとに選べます。
    # デバイス ID はビルドごとに別 (CUDA0 と Vulkan0 は同じ GPU ではない) なので、
    # 切り替えるとデバイス選択は自動でクリアされます。
    #
    # ★ バリアントは binary 必須。省略すると PATH の llama-server に落ちて
    #   「CUDA ビルドを指定したつもりで素のビルドが動く」事故になるため、
    #   設定ロード時にエラーにしています。
    #
    # ★ 対応ランタイム (CUDA Toolkit / Vulkan ランタイム + ICD / ROCm) は
    #   自分で導入してください。CodeRouter は導入も事前検査もしません。
    #
    # ★ 異アーキテクチャの GPU を混ぜて使うなら、ビルド時に両方の
    #   アーキテクチャを含めること (例: RTX 3090 + RTX 5090 の CUDA ビルド)
    #     -DCMAKE_CUDA_ARCHITECTURES="86-real;120a-real"
    #   片方だけだと、載っていない側は JIT 待ちか単純に使われません。
    #
    # 書かなければセレクトは従来どおり 3 択のままです。
    #
    # llama.cpp-cuda:
    #   binary: ~/llm/apps/llama.cpp/build-cuda/bin/llama-server
    # llama.cpp-vulkan:
    #   binary: ~/llm/apps/llama.cpp/build-vulkan/bin/llama-server
    # llama.cpp-rocm:
    #   binary: ~/llm/apps/llama.cpp/build-rocm/bin/llama-server

  option_profiles:

    # ══════════════════════════════════════════════════════════════════
    # ★★ まず読む: 2026-08 版 llama.cpp の考え方 ★★
    # ══════════════════════════════════════════════════════════════════
    #
    # 【1】既定値が全部 "auto" になった
    #   -ngl  : 既定 auto (旧: 0)。数値を書くと **自動レイヤ配分が止まる**
    #   -c    : 既定 0 = モデルの学習長を採用 (旧: 4096 固定)
    #   -fa   : 既定 auto
    #   -np   : llama-server は既定 -1 = auto
    #   -ts   : 未指定なら -fit が実測 VRAM から自動生成
    #
    # 【2】-fit (自動メモリフィット) が既定 on
    #   起動時に各デバイスの実メモリを測り、
    #     ・コンテキスト長の縮小
    #     ・GPU レイヤ配分 (ngl)
    #     ・複数 GPU のテンソル分割 (tensor-split)
    #     ・テンソル上書き (tensor-buft-override)
    #   を自動で決めます。
    #
    # 【2-b】⚠⚠ ここが最重要: 手で書くと fit が「丸ごと」死ぬ項目がある ⚠⚠
    #   fit は「既定値のままの項目だけ」を触る仕様です (common/fit.h)。
    #   しかも項目によって、挙動が2種類に分かれます。
    #
    #   (A) その項目の調整だけ諦める … -c / --ctx-size
    #       → fit は生き続け、レイヤ配分や tensor-split は自動のまま。安全。
    #
    #   (B) fit 全体が abort する … -ngl / -ts / -ot / -ncmoe / -cmoe /
    #                               -sm row (複数GPU時) / -sm tensor
    #       → 例: "n_gpu_layers already set by user to 99, abort"
    #             "model_params::tensor_buft_overrides already set by user, abort"
    #       ctx の自動縮小も、レイヤ配分も、tensor-split 生成も、全部止まります。
    #
    #   ★ しかも (B) はエラーになりません。WARN が1行出るだけで起動は続きます。
    #     "failed to fit params to free device memory: ... abort"
    #     気づかないまま OOM か VRAM スピルを踏むので、ログを必ず確認してください。
    #
    #   → つまり -ngl 99 を書き足す行為は「全層 GPU に載せる指示」ではなく、
    #     「自動最適化を全部切って、あとは自分でやる宣言」です。
    #
    # 【3】したがって基本方針は「何も書かない」
    #   このファイルの推奨プロファイルは args がほぼ空です。異常ではありません。
    #   足りないときだけ、下の「VRAM 不足時の対処順」を上から順に足してください。
    #   自分でチューニングしたいときは、まず `llama-fit-params` に fit の
    #   決めた引数を吐かせて、それを起点にするのが上流の推奨フローです。
    #
    # 【4】VRAM 不足時の対処順 (上から試す)
    #   1. 何も指定せず起動 (fit に任せる)
    #   2. -fitc N       … 縮小の下限を決める (これ以上は縮めない = 下回るなら失敗)
    #   3. -ctk q8_0 -ctv q8_0  … KV キャッシュ量子化。効果大
    #   4. -ub 256       … 物理バッチ縮小 (既定 512)
    #   5. -ncmoe N      … MoE モデル限定。先頭 N 層の MoE 重みを CPU に退避
    #                      ⚠ ただし 4 までと違い、これは fit を abort させます (【2-b】)。
    #                        fit は本来 MoE の exps を自分であふれさせる処理を持つので、
    #                        まず 1〜4 を試し、それでも駄目なときだけ手動に切り替える。
    #
    # 【5】⚠ 削除済みオプション (書くと **起動失敗**)
    #   PR #22397 (b8955 / 2026-04-28) で投機デコードの引数が刷新されました。
    #   --draft / --draft-n / --draft-max  → --spec-draft-n-max / --spec-ngram-mod-n-max
    #   --draft-min / --draft-n-min        → --spec-draft-n-min / --spec-ngram-mod-n-min
    #   --spec-ngram-size-n                → --spec-ngram-*-size-n / --spec-ngram-mod-n-match
    #   エラー: "the argument has been removed. use --spec-draft-n-max or ..."
    #   ⚠ 環境変数 LLAMA_ARG_DRAFT_MAX / LLAMA_ARG_DRAFT_MIN も生き残っており、
    #     **env に設定してあるだけで起動に失敗します**。古い systemd unit や
    #     docker-compose を使い回している場合は先に確認してください。
    #
    # 【6】⚠ 非推奨になったもの (動くが警告)
    #   PR #20834 (b10105 / 2026-07-23) で --mlock / --no-mmap / --direct-io が
    #   -lm / --load-mode に統合されました。値は none / mmap / mlock /
    #   mmap+mlock / dio の5つ、既定は mmap。
    #
    #   --no-mmap  → "-lm": "none"
    #   --mlock    → "-lm": "mmap+mlock"   ★"mlock" ではありません
    #
    #   ⚠ ここが罠。PR #26135 (b10145 / 2026-07-27) で "mlock" の定義自体が
    #     「mmap **しない** mlock」に変わりました。旧 --mlock は mmap + mlock
    #     だったので、素直に "-lm": "mlock" と置き換えると挙動が変わります。
    #     旧来と同じ意味にしたいなら "mmap+mlock" を選んでください。
    #     (--mlock という綴りをそのまま使い続けている人も、2026-07-27 を境に
    #      意味が変わっています)
    #
    #   ※ Vulkan の「--no-mmap が必須」は **もう正しくありません**。
    #     公式ドキュメントに根拠はなく、むしろ b7502 (2025-12-21) 以降の
    #     AMD Vulkan で mmap 無効時に "read error: Bad address" の報告
    #     (#18317 / #18473) があります。既定の mmap のままにしてください。
    #
    # 【7】⚠⚠ 最大の落とし穴: "-fa": true と書くと起動失敗する ⚠⚠
    #   CodeRouter は bool の true を「値なしフラグ」として argv に出します。
    #   ところが今の -fa は **値必須** (on|off|auto) に変わったため、
    #   bare な -fa は "expected value for argument" で落ちるか、
    #   次のフラグを値として食って落ちます。
    #   → 必ず "-fa": "on" のように **文字列で値を書いてください**。
    #   同じ理由で、値を取るオプションに true を使わないこと。
    #
    # 【8】⚠ -np (--parallel) の意味が変わった
    #   auto (既定) → n_parallel=4 かつ **kv_unified=true**。
    #                 4 スロットが ctx を共有するので n_ctx_seq = n_ctx (フル)。
    #   明示 -np N   → kv_unified=false。n_ctx_seq = n_ctx / N に **割られる**。
    #   → 旧テンプレの「--ctx-size = 並列数 × 32768」は auto では不要です。
    #     条件を固定したいベンチ用途でだけ -np を明示してください。
    #
    # 【9】⚠ --jinja は既定 on になりました
    #   Gemma の空出力対策で付けていた "--jinja": true は **もう不要**です
    #   (書いても害はありません)。逆に無効化したいときだけ --no-jinja。
    #
    # 【10】⚠ CodeRouter 側の注意 (UI との二重指定)
    #   ・「⚙ 推奨値」ボタンは追加オプション欄に "-ngl N --ctx-size N --threads N"
    #     を入れます。追加オプションは argv の **最後** に置かれ後勝ちなので、
    #     押すと自動フィットが無効化されます。fit に任せたいなら押さない/消す。
    #   ・複数デバイスを選ぶと UI が --tensor-split を自動で足します。
    #     fit の自動分割を使いたいなら **tensor-split 欄は空にしてください**。
    #   ・--device / --tensor-split は プロファイルに書かないこと (UI 選択より
    #     後ろに載って後勝ちし、UI のデバイス選択を黙って上書きします)。
    #
    # 【11】⚠ セキュリティ
    #   --host 0.0.0.0 + ツール有効 + --api-key 無し = LAN から無認証で
    #   シェルコマンド実行が可能になります。外に開くなら --api-key を必須に。
    # ══════════════════════════════════════════════════════════════════

    # ⚠ context size の考え方 (Claude Code 用途)
    #   Claude Code は毎ターン 15〜35K tokens の system prompt + 会話を送ります。
    #   実効 ctx が小さいと "exceed_context_size_error (400)" → CodeRouter からは
    #   provider-failed → 502 になります。
    #   今は -c を固定するのではなく **-fitc 32768 で「下限」を宣言**するのが正解です。
    #   fit は 32768 を下回るところまでは縮めず、無理なら起動時に失敗します
    #   (＝ 黙って短い ctx で動いて後から 502 になる事故を防げる)。

    # ── llama.cpp オプションプロファイル ──────────────────────────────────────
    llama.cpp:

      # 名前にバックエンドを含めない: llama.cpp-cuda / -vulkan / -rocm 側で
      # 同名のまま上書きできるようにするため。

      # ★ 迷ったらこれ。args がほぼ空なのが「正しい最新設定」です。
      #   -ngl も -c も -fa も書きません。全部 fit が実測して決めます。
      - name: "おまかせ (自動フィット・推奨)"
        args:
          "-fitc": 32768          # Claude Code の下限。これ未満には縮めさせない

      # 起動はするが VRAM がギリギリ / たまに OOM するとき。
      # KV キャッシュを q8_0 にするだけで空き方が大きく変わります。
      - name: "自動フィット + KV量子化 (VRAM 節約)"
        args:
          "-fitc": 32768
          "-ctk": "q8_0"          # 選択可: f32/f16/bf16/q8_0/q5_1/q5_0/iq4_nl/q4_1/q4_0
          "-ctv": "q8_0"

      # 上でも足りないとき。物理バッチを削って一時メモリを減らします。
      # プロンプト処理は遅くなるので、載らないときの最後の手段。
      - name: "自動フィット + 限界まで節約"
        args:
          "-fitc": 16384          # ここまで下げると Claude Code は厳しい。単発用途向け
          "-ctk": "q8_0"
          "-ctv": "q8_0"
          "-ub": 256              # 既定 512
          # "-lm": "none"         # mmap を切る (通常不要。ページキャッシュが効かなくなる)

      # ── MoE モデル (gpt-oss / Qwen3-MoE / DeepSeek 系) ───────────────
      #   MoE は「総パラメータは巨大だが 1 トークンで使うのは一部」なので、
      #   先頭 N 層のエキスパート重みを CPU に置くと VRAM が劇的に空きます。
      #   N は 4 → 8 → 16 と増やしながら、載る最小値を探すのがコツ。
      #   全層を CPU に出すなら -cmoe (値なし) を使います。
      #
      #   ⚠⚠ これは「手動モード」です。-ncmoe / -cmoe は tensor_buft_overrides を
      #     書くため、fit が "tensor_buft_overrides already set by user, abort" で
      #     **丸ごと停止** します (【2-b】)。したがって:
      #       ・-fitc は意味を持ちません (fit が動かないので)。書かないこと
      #       ・ctx は自動で決まらないので --ctx-size を **自分で書く必要があります**
      #         (書かないと -c 0 = モデルの学習長いっぱいを取りに行って OOM します)
      #     fit は本来 MoE の exps を自分であふれさせる処理を持っているので、
      #     **まず「自動フィット + KV量子化」を試してから**ここに来てください。
      - name: "MoE: エキスパートを CPU 退避 (手動モード)"
        args:
          "-ncmoe": 8             # 先頭 8 層の MoE 重みを CPU へ。載らなければ増やす
          "--ctx-size": 32768     # ★fit が止まるので必須。書かないと OOM
          "-ctk": "q8_0"
          "-ctv": "q8_0"
          # "-cmoe": true         # ← 全 MoE 層を CPU に。-ncmoe とは併用しない

      # ── 複数 GPU ─────────────────────────────────────────────────────
      #   旧: -ts 32,24 のように容量比を手計算して指定 → **もう不要**
      #   新: -sm layer (既定) のまま、-ts は書かない。fit が実測で配分します。
      #       調整したいのは「各デバイスに何 MiB 余白を残すか」だけ = -fitt。
      #
      #   -fitt の書き方:
      #     "3072,1024" … デバイス0 に 3072MiB、デバイス1 に 1024MiB の余白
      #     "2048"      … 全デバイスに一律 2048MiB (単値は全体にブロードキャスト)
      #   既定は 1024 MiB。ディスプレイ出力を繋いでいる GPU / 他アプリと同居する
      #   GPU ほど余白を厚くします (デスクトップ表示だけで 1〜2GB は食います)。
      #
      #   ⚠ 異容量 (32GB + 24GB) でも同容量 (24GB × 2) でも、やることは同じです。
      #     容量比の手計算は fit が肩代わりするので、比を書く必要はありません。
      #   ⚠ 世代混在の 2 枚使いは、遅い側と GPU 間転送に律速されます。
      #     1 枚に収まるモデルなら 1 枚に寄せた方が速いことが多く、要実測です。
      #   ⚠ UI の tensor-split 欄は **空のまま**にしてください (下記【10】参照)。
      - name: "複数GPU おまかせ (fit 自動分割)"
        args:
          "-fitc": 32768
          "-fitt": "2048"         # まず全デバイス一律。OOM するデバイスがあれば個別化

      # ディスプレイを繋いでいる GPU が 0 番、計算専用が 1 番、という典型構成。
      # 0 番だけ余白を厚くしておくと、デスクトップ描画と喧嘩しません。
      - name: "複数GPU (表示用GPUに余白を厚く)"
        args:
          "-fitc": 32768
          "-fitt": "3072,1024"    # dev0=3GiB / dev1=1GiB。枚数分カンマ区切りで書く
          "-ctk": "q8_0"
          "-ctv": "q8_0"

      # 分割モードを変えたいとき用。既定の layer で困っていないなら触らないこと。
      #   none   : 分割せず 1 デバイスに載せる (-mg でどれを使うか選ぶ)
      #   layer  : 既定。レイヤ単位で分配。安定
      #   row    : 行分割。まだ現役 (削除されていません)
      #   tensor : 新設・EXPERIMENTAL。速いことがあるが、GLM-4.5 系のように
      #            投機デコード用の nextn ヘッダを含む MoE ではロード時に
      #            クラッシュする報告あり (llama.cpp #24309、未解決)
      #
      # ⚠ row (複数GPU時) も tensor も、fit は未対応で abort します (【2-b】)。
      #   使うなら --ctx-size と -ngl を自分で書く手動モードになります。
      # - name: "複数GPU (分割モード実験・手動モード)"
      #   args:
      #     "-sm": "tensor"
      #     "-ngl": 99
      #     "--ctx-size": 32768

      # ── 長コンテキスト ───────────────────────────────────────────────
      #   -fitc で「下限」を宣言する形にすると、VRAM に余裕があればモデルの
      #   学習長いっぱいまで伸ばしてくれます。
      #   きっかり 128K に固定したいなら "-c": 131072 (fit の縮小が止まります)。
      - name: "長コンテキスト (128K 以上)"
        args:
          "-fitc": 131072
          "-ctk": "q8_0"          # 長 ctx ほど KV 量子化の効きが大きい
          "-ctv": "q8_0"
          # "--ctx-size": 131072  # ← きっかり固定したいときはこちら

      # ── 投機的デコード (ドラフトモデル不要) ─────────────────────────
      #   --spec-default は ngram-mod 系の自己投機を有効にするワンライナー。
      #   追加モデルも追加 VRAM も要らないので、まず試すならこれ。
      #   コード生成のような「繰り返しの多い出力」ほど効きます。
      #   ⚠ -sm tensor との併用はクラッシュ報告あり (#24309)。
      - name: "投機デコード (ドラフト不要・高速化)"
        args:
          "-fitc": 32768
          "--spec-default": true  # 値なしフラグなので true でよい

      # ── ベンチ比較用 (条件固定) ──────────────────────────────────────
      #   バックエンド間 (CUDA / Vulkan / ROCm) を横並びで測るための固定条件。
      #   **速度を出す設定ではなく、条件を揃えることが目的** なので値は動かさない。
      #   ここだけは -fit off にします。fit を効かせると機種ごとに ctx や
      #   レイヤ配分が変わってしまい、そもそも比較が成立しないためです。
      #     -fit off  : 自動調整を全部止める
      #     -ngl 99   : 全層 GPU。ここがずれると CPU 実行と比べることになる
      #     -np 1     : kv_unified を切って 1 スロット固定。実効 ctx をブレさせない
      #     -c 32768  : llmbench / Claude Code が通る最小ライン
      #     -fa on    : auto に任せると機種で on/off が変わるので明示 (値は必須)
      #   バリアント側では何も上書きしないのが正解です (argv が完全一致します)。
      - name: "ベンチ比較用 (条件固定)"
        args:
          "-fit": "off"
          "-ngl": 99
          "--ctx-size": 32768
          "--parallel": 1
          "--batch-size": 2048    # 現行既定に合わせた
          "--ubatch-size": 512
          "-fa": "on"
          "--threads": 8

      # 並列スループットのベンチ。auto (=4並列 + KV共有) と条件を変えて
      # 「スロットごとに ctx を割る」古典的な構成を測りたいとき用。
      - name: "ベンチ: 並列固定 (4並列・ctx分割)"
        args:
          "-fit": "off"
          "-ngl": 99
          "--parallel": 4
          "--ctx-size": 131072    # 4並列 × 各スロット 32768。VRAM に注意
          "--batch-size": 2048
          "--ubatch-size": 512
          "-fa": "on"

      # ── CPU のみ ─────────────────────────────────────────────────────
      # ⚠ GPU ビルド (cuda/vulkan/rocm) を選んでいてもこれを選べば CPU 実行です。
      #   バックエンド表示と実際の計算場所が食い違うので、比較には使わないこと。
      - name: "CPU のみ (GPU未使用・低速)"
        args:
          "-fit": "off"
          "-ngl": 0
          "--ctx-size": 32768     # Claude Code 最低ライン。CPU 推論は遅いので注意
          "--threads": 12
          "-lm": "mmap+mlock"     # 旧 --mlock 相当。"mlock" 単独は mmap を切る別物

      # ── Apple Silicon ────────────────────────────────────────────────
      #   統合メモリなので fit の実測がそのまま効きます。基本は何も書かない。
      #   macOS はカーネル等が使う分を残す必要があるので、余白を少し厚めに。
      - name: "Apple Silicon M-series"
        args:
          "-fitc": 32768
          "-fitt": "4096"         # 統合メモリ機は OS の取り分を厚めに残すと安定

      # ── Gemma 系 (空出力 / empty output 対策) ────────────────────────
      #   症状: gemma4:26b(-A4B) 等で patch/tool 生成タスクが
      #         "empty output" → "patch parse failed" になり quality=0。
      #   主因は チャットテンプレート不一致 でした。
      #   ★ 2026-08 時点では --jinja が **既定 on** になったため、
      #     GGUF 埋め込みテンプレートは黙っていても使われます。
      #     残る対策はサンプリングだけです (低温 + min-p で degenerate を抑える)。
      #     素の Gemma 推奨 (temp 1.0 / top-k 64 / top-p 0.95) は自由記述向けで、
      #     patch 生成には向きません。
      - name: "Gemma 系 (空出力対策)"
        args:
          "-fitc": 32768
          "--temp": 0.6           # 構造化出力向けに低め (自由記述は 1.0 でも可)
          "--top-p": 0.9
          "--top-k": 40
          "--min-p": 0.05         # 低確率トークンを切り、空/崩れ応答を抑制
          # "--chat-template": "gemma"  # テンプレ未埋め込み GGUF のときだけ
          # "--no-jinja": true          # 逆に jinja を切りたいとき

      # ── ネットワーク公開する場合 ─────────────────────────────────────
      # ⚠ --host 0.0.0.0 でツールを有効にしたまま --api-key を付けないと、
      #   LAN 内の誰でも無認証でホスト上のシェルコマンドを実行できます。
      #   外に開くなら API キーを必ず設定してください。
      # - name: "LAN 公開 (APIキー必須)"
      #   args:
      #     "-fitc": 32768
      #     "--host": "0.0.0.0"
      #     "--api-key": "change-me-please"

    # ── ビルド別オプションプロファイル (v2.11.0+) ─────────────────────────
    # 上の backends でバリアント (llama.cpp-cuda 等) を宣言している場合、
    # option_profiles にも同じキーを書けます。
    #
    #   * 基底名 "llama.cpp" のプロファイルは **全ビルドに継承** されます。
    #     共通設定をビルドごとに複製する必要はありません。
    #   * バリアント固有のものは継承分の **後ろ** に並びます。
    #   * name が衝突した場合はバリアント側が **継承分と同じ位置で差し替え**
    #     ます (末尾に重複を作りません)。
    #
    # ★ --device / --tensor-split はプロファイルに書かないでください。
    #   デバイスは UI の「🔍 検出」→ チェックボックスで選ぶのが正しい流れで、
    #   両方から指定すると argv に --device が二重に載ります。プロファイル側が
    #   後ろに来るので **UI のデバイス選択を黙って上書きします**。
    #   デバイス ID はビルドごとに別の名前空間 (CUDA0 と Vulkan0 は同じ GPU では
    #   ない) なので、そもそもプロファイルに固定値として書けません。
    #
    # ★ 継承される "ベンチ比較用 (条件固定)" は **どのビルドでも上書きしない**のが
    #   正解です。上書きしなければ 3 ビルドとも argv が完全に一致し、違いは UI で
    #   選ぶデバイスだけになります (Launcher の「⚙ ビルド横断」スイープで
    #   CUDA / Vulkan / ROCm を順に起動して比較できます)。
    #
    # ★ "CPU のみ (GPU未使用・低速)" も継承されます。GPU ビルドを選んでいても
    #   選べてしまうので、名前で見分けてください (-ngl 0 = GPU に載りません)。
    #
    # ★ 2026-08 版では、そもそもビルド別に上書きしたい項目がほとんど無くなりました
    #   (-ngl も -ts も fit が決めるため)。下は「どうしても必要なら」の例です。
    #
    # llama.cpp-cuda:
    #   # 24GB クラス 2 枚のワークステーション。表示用 GPU に余白を厚く。
    #   - name: "おまかせ (自動フィット・推奨)"
    #     args:
    #       "-fitc": 65536             # VRAM に余裕があるので下限を上げる
    #       "-fitt": "3072,1024"
    #
    # llama.cpp-vulkan:
    #   - name: "おまかせ (自動フィット・推奨)"
    #     args:
    #       "-fitc": 32768
    #       # ⚠ 旧テンプレの "--no-mmap": true は **もう付けないでください**。
    #       #   Vulkan で mmap を切ると read error になる報告 (#18317) があります。
    #       #   どうしても必要なら "-lm": "none" (--load-mode) を使うこと。
    #
    # llama.cpp-rocm:
    #   - name: "おまかせ (自動フィット・推奨)"
    #     args:
    #       "-fitc": 32768
    #       "-fitt": "2048"            # ROCm は total 表示より実効 free が小さいことがある
    #
    #   # ROCm は GPU の可視範囲を環境変数でも絞れます (HIP_VISIBLE_DEVICES 等)。
    #   # option_profiles は CLI 引数しか渡さないので、必要なら coderouter 起動側の
    #   # 環境変数で設定してください。env で絞ると UI に出るデバイス番号も
    #   # 「絞った後の並び」になる点に注意 (ROCm0 が別の GPU を指しえます)。
    #
    # ★ --ctx-size を明示した場合、それは全スロットの合計です。--parallel N を
    #   明示すると 1 スロットあたりは ctx-size / N になります。
    #   ただし --parallel を **auto (未指定) のままにすると KV が共有され**、
    #   4 スロットすべてが ctx 全体を使えます。ベンチでビルド間を比べるときは
    #   --parallel を明示して条件を揃えてください。

    # ── vllm オプションプロファイル ───────────────────────────────────────────
    # ※ 今回の刷新は llama.cpp が主対象です。vLLM 側は既存構成を維持しつつ、
    #   マルチ GPU まわりのコメントだけ補強しています。

    vllm:

      - name: "標準 (auto dtype)"
        args:
          "--dtype": "auto"
          "--max-model-len": 32768   # Claude Code 用。モデルの対応長以内で増減可
          "--gpu-memory-utilization": 0.85

      - name: "高速推論 (float16)"
        args:
          "--dtype": "float16"
          "--max-model-len": 32768   # 同上。長い会話は 65536 以上を検討
          "--gpu-memory-utilization": 0.90
          "--max-num-batched-tokens": 8192

      - name: "省メモリ (bitsandbytes int8)"
        args:
          "--dtype": "float16"
          "--quantization": "bitsandbytes"
          "--load-format": "bitsandbytes"
          "--max-model-len": 16384   # 省メモリ用に小さめ。Claude Code には不足する場合あり
          "--gpu-memory-utilization": 0.70

      - name: "長コンテキスト (32K)"
        args:
          "--dtype": "auto"
          "--max-model-len": 32768
          "--gpu-memory-utilization": 0.92

      # vLLM のマルチ GPU は llama.cpp と思想が逆で、**手で指定するもの**です。
      #   --tensor-parallel-size N : 1 モデルを N 枚に分割 (枚数は割り切れる数に)
      #   ⚠ 異容量 GPU の混在は TP と相性が悪く、小さい側に合わせて頭打ちします。
      #     容量が揃っていないなら llama.cpp + fit の方が扱いやすいです。
      - name: "マルチ GPU (tensor parallel x2)"
        args:
          "--dtype": "auto"
          "--tensor-parallel-size": 2
          "--max-model-len": 65536   # 2 GPU なら余裕。Claude Code(~35K)も収まる
          "--gpu-memory-utilization": 0.85
