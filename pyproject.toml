[project]
# v1.7-A: PyPI distribution name was `coderouter-cli` because the bare
# `coderouter` slot was already taken by Lawrence Chen's unrelated HTTP
# routing library (uploaded 2025-06, single 0.1.0 release).
# Fork: this distribution is `coderouter-t` (t = translate) - a
# translate-enhanced fork of zephel01/CodeRouter. The Python *import*
# name stays `coderouter` (unchanged) so existing code keeps working:
#     pip install coderouter-t           # install (fork)
#     coderouter-t serve --port 8088     # run (fork, primary)
#     coderouter serve --port 8088       # run (alias, kept for compatibility)
#     import coderouter                  # import (unchanged)
name = "coderouter-t"
version = "2.16.0"
description = "Local-first, free-first, fallback-built-in LLM router. Claude Code / OpenAI compatible."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "zephel01", email = "zephel01@gmail.com" }]
keywords = ["llm", "router", "fallback", "local-first", "claude", "claude-code", "ollama", "openai", "openrouter", "nvidia-nim"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Networking",
    "Typing :: Typed",
]

# ============================================================
# Runtime dependencies — STRICTLY 5 packages (see plan.md §5.4)
# Do NOT add anthropic / openai / litellm / langchain etc.
# All upstream calls go through httpx directly.
# ============================================================
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "httpx>=0.27.0",
    "pydantic>=2.9.0",
    "pyyaml>=6.0.2",
]

[project.optional-dependencies]
# v1.7-B (#3): `coderouter doctor --check-model --apply` writes the
# doctor-emitted YAML patches back into providers.yaml /
# model-capabilities.yaml while preserving comments and key order. That
# round-trip behavior requires ``ruamel.yaml`` — pyyaml does not preserve
# comments or formatting on dump. Kept OPTIONAL (not in the strict 5 base
# deps) because the typical user path (``serve``) never needs it; only
# operators who actually run ``doctor --apply`` install it via
# ``pip install coderouter-t[doctor]`` (or ``uv tool install
# coderouter-t --with ruamel.yaml``). Lazy-imported in
# ``coderouter.doctor_apply`` so the absence is invisible until the
# feature is invoked.
doctor = [
    "ruamel.yaml>=0.18.6",
]
# Low-memory accuracy track: precise token counting for the memory-budget
# guard (CJK char/4 under-counting is the main OOM/over-trim trigger).
# OPTIONAL — lazy-imported in ``coderouter.token_estimation_accurate`` with a
# char/4 fallback, so the strict 5 base deps are unchanged. ``tokenizers``
# is loaded local-file-only (no HuggingFace Hub network access).
accuracy = [
    "tokenizers>=0.20",
]
# Optional rescue-parsing hardening for malformed tool-call JSON emitted by
# small models. Lazy-imported; absence falls back to the built-in repair.
repair = [
    "json-repair>=0.60.1",
]
# Translation layer — CPU Argos Translate. Optional: only needed when
# translation.enabled = true. Argos 1.x is pydantic v1 based → Python 3.12-3.13 only.
# NOTE: lower bound is 1.11 (not 1.11.1) because 1.11.1 is not yet on PyPI
# (2026-09-02 only 1.11.0 published); keep <2 for future breaking changes.
# Marker restricts to 3.12-3.13 so pip on 3.14+/3.11 does not try to resolve
# pydantic-v1 Argos (would fail). Base package requires-python is >=3.12,
# so 3.11 is already excluded, but marker makes intent explicit.
translation = [
    "argostranslate>=1.11,<2; python_version >= '3.12' and python_version < '3.14'",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-httpx>=0.32.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "types-PyYAML>=6.0.12",
    # tests for v1.7-B doctor --apply exercise the same round-trip path
    # that operators use, so ruamel.yaml has to be available in the dev
    # environment too. Kept here (in addition to the [doctor] extra) so
    # ``uv sync --extra dev`` is enough for a full test run without
    # remembering to also pass ``--extra doctor``.
    "ruamel.yaml>=0.18.6",
]

[project.scripts]
coderouter-t = "coderouter.cli:main"
coderouter = "coderouter.cli:main"

[project.urls]
Homepage = "https://github.com/OrgaiCom/CodeRouter"
Repository = "https://github.com/OrgaiCom/CodeRouter"
Issues = "https://github.com/OrgaiCom/CodeRouter/issues"
Changelog = "https://github.com/OrgaiCom/CodeRouter/blob/main/CHANGELOG.md"
Documentation = "https://github.com/OrgaiCom/CodeRouter#documentation"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["coderouter"]
# PEP 561 marker (classifiers carries "Typing :: Typed" — this is what
# backs that claim up). `packages = ["coderouter"]` already sweeps the
# whole package directory into the wheel, so py.typed is included
# implicitly, but force-include makes that explicit and keeps the file
# present even if the packaging strategy above ever changes.
force-include = { "coderouter/py.typed" = "coderouter/py.typed" }

# v1.7-A: strict sdist allowlist (`only-include`) so a developer's
# local virtualenv (.venv / .venv-test / .venv-v16), build artifacts
# (dist/), and scratch files can never sneak into a published tarball.
# `only-include` is the safest pattern with hatch — anything not
# explicitly listed is dropped, which avoids the "exclude pattern
# didn't match my OS-specific path" footgun. Keep the list tight:
# we ship the runtime package, examples, tests (so users can run
# the suite from sdist), docs, and the standard root files.
#
# `docs` is intentionally NOT listed as a bare entry — docs/inside/
# (private scratch notes) and docs/articles/ (externally-published
# article drafts) are declared "NEVER commit" in .gitignore and must
# never end up in a published tarball. They are untracked by git, so
# GitHub Actions' fresh checkout (release.yml) never picks them up —
# but `uv build` run from a maintainer's local working tree does not
# know that and would happily include whatever is on disk. Listing the
# public docs/ subdirectories explicitly means docs/inside and
# docs/articles are excluded structurally, not just by convention: even
# if hatch's `docs` handling ever changed, there is no bare "docs" entry
# left to accidentally sweep them in.
#
# Every entry below must be git-tracked. A directory that only exists in
# a maintainer's working tree (docs/evidence was one) makes this list
# lie: it looks shipped, but a fresh checkout has nothing to ship and
# tests/test_packaging.py fails. Check with `git ls-files docs/` before
# adding to this list, not `ls docs/`.
[tool.hatch.build.targets.sdist]
only-include = [
    "coderouter",
    "examples",
    "tests",
    "docs/README.md",
    "docs/README.en.md",
    "docs/low-memory-integration.md",
    "docs/low-memory-integration.en.md",
    "docs/assets",
    "docs/backends",
    "docs/concepts",
    "docs/designs",
    "docs/guides",
    "docs/openrouter-roster",
    "docs/retrospectives",
    "docs/start",
    "scripts",
    "README.md",
    "README.en.md",
    "CHANGELOG.md",
    "LICENSE",
    "pyproject.toml",
]

# ============================================================
# Linting / formatting
# ============================================================
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "F", "W",  # pycodestyle / pyflakes
    "I",            # isort
    "B",            # bugbear
    "UP",           # pyupgrade
    "SIM",          # simplify
    "RUF",          # ruff-specific
]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.lint.per-file-ignores]
# v2.15.0 i18n: Japanese catalog strings intentionally use fullwidth
# punctuation （）／： etc. — RUF001/002/003 flag them as ambiguous
# unicode but they are correct Japanese typography. Ignore only here;
# the rest of the codebase keeps the check to catch homoglyph bugs.
"coderouter/messages.py" = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.format]
quote-style = "double"

# ============================================================
# Type checking
# ============================================================
[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true

# ============================================================
# Testing
# ============================================================
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"
