name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# CI philosophy (plan.md §5.4, retrospective v1.0):
#   CodeRouter ships no binary build — it's a pure-Python router/CLI
#   that the operator runs locally. CI is therefore scoped to two
#   concerns that actually save the operator's time:
#
#     1. Regression safety  — pytest + ruff check + SDK-forbid grep
#     2. Supply-chain hygiene — lockfile freeze + secret scan +
#                               multi-source CVE audit + dep-review
#
#   Style (ruff format) and strict typing (mypy --strict) are useful
#   during development but are not enforced in CI because they do not
#   catch security or functional regressions. Run locally:
#       uv run ruff format .
#       uv run ruff check .

# Supply-chain hardening: default every job to read-only. Jobs that
# need write access (e.g. gitleaks posting a PR comment) opt in
# explicitly at the job level.
permissions:
  contents: read

jobs:
  # -------------------------------------------------------------------
  # Regression gate — functional safety across the 3.12 / 3.13 matrix.
  #
  # `uv sync --frozen` refuses to proceed if `uv.lock` drifted from
  # `pyproject.toml`. This is the first line of supply-chain defense:
  # nothing resolves a new transitive without an explicit lockfile
  # update committed to the repo.
  # -------------------------------------------------------------------
  test:
    # ⚠️ This string is a required status check on main. Branch protection
    # matches check names *exactly*, so renaming it means the old name is
    # never reported again and every PR sits at "Expected — waiting for
    # status to be reported" until someone edits the protection rules.
    # That is not hypothetical: adding `${{ matrix.os }}` here for the
    # macOS runner made PR #80 unmergeable on 2026-08-04.
    #
    # If you re-add macOS, the name has to grow an os component (two jobs
    # cannot share one check name) — do that and update the required
    # checks in the same change, not after.
    name: Tests & Lint (py ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.12", "3.13"]
        # macOS is deliberately absent for now. This is a deferral, not a
        # judgement that it isn't worth running.
        #
        # It was added on the v2.12.0 branch and immediately failed six
        # launcher tests — every test that spawns a real stub process and
        # requires its /health to answer 200 within the harness's 5.0s
        # readiness_timeout_s, and no others. Everything else passed on
        # macOS: spawn, argv construction, the `#!{sys.executable}`
        # shebang, crash detection, SIGTERM handling, TTL, registry. The
        # child is not dying — if it died, _tail_logs would flip the
        # status to `error` and readiness would return well inside the
        # budget instead of timing out at exactly 5.0s.
        #
        # So this looks like a property of the 5.0s harness budget, which
        # is 1/60th of the shipped default (readiness_timeout_s: 300.0),
        # rather than of the product. Leading hypothesis: CPython's
        # HTTPServer.server_bind() calls socket.getfqdn() between bind()
        # and listen(), and on macOS that reverse lookup can fall through
        # to mDNSResponder and block for seconds, during which connects
        # are refused. glibc answers from `files` instantly.
        #
        # To re-enable: raise those six tests' readiness_timeout_s (and
        # the matching _poll(timeout=)) from 5.0 to ~30.0, put
        # macos-latest back with `exclude: {os: macos-latest,
        # python-version: "3.12"}` so the matrix is 3 jobs not 4, and see
        # whether they pass. The diagnostic script that settles it lives
        # in _OUTPUTS/02-レビュー監査/2026-08-04_stage3-fixes/.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3.2.4

      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies (lockfile-frozen)
        run: uv sync --frozen --extra dev

      - name: Verify UTF-8 encoding (C-3)
        run: |
          python -c "from pathlib import Path; Path('README.md').read_text(encoding='utf-8'); print('README.md utf-8 ok')"
          python -c "from pathlib import Path; Path('coderouter/messages.py').read_text(encoding='utf-8'); print('messages.py utf-8 ok')"

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Tests
        run: uv run pytest -v

      - name: Forbidden import check (no anthropic / openai / litellm SDKs)
        run: |
          # plan.md §5.4 — the router itself must not depend on heavy SDKs
          if grep -RnE "^\s*(import|from)\s+(anthropic|openai|litellm|langchain)" coderouter/; then
            echo "Forbidden SDK import detected — see plan.md §5.4 (dependency minimalism)."
            exit 1
          fi

  # -------------------------------------------------------------------
  # Secret-leak gate — scan full history for committed credentials.
  #
  # Runs on push AND pull_request so forks can't sneak a secret in.
  # gitleaks exits non-zero on any finding.
  # -------------------------------------------------------------------
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Full history — gitleaks scans every commit, not just HEAD.
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # -------------------------------------------------------------------
  # CVE audit — multi-source (pip-audit + OSV-Scanner).
  #
  # Two sources of advisories because they don't perfectly overlap:
  #   - pip-audit: PyPA Advisory DB (primary for Python packages)
  #   - OSV-Scanner: Google OSV (broader, picks up GHSA + language-
  #                  agnostic advisories PyPA hasn't mirrored yet)
  #
  # Both scan the locked dependency set (uv.lock) so results match
  # exactly what `uv sync --frozen` installs in the test job.
  # -------------------------------------------------------------------
  cve-audit:
    name: Dependency CVE audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3.2.4

      - name: Set up Python
        run: uv python install 3.12

      - name: Export lockfile as requirements.txt (no project)
        # `--no-emit-project` excludes the root package (coderouter
        # itself), which is not published on PyPI. The resulting
        # requirements.txt is exactly the pinned transitive set from
        # uv.lock — no editable install, no unpublished names.
        #
        # `--all-extras` (was `--extra dev` only): `pip install
        # coderouter-t[accuracy]` (tokenizers) and `[repair]`
        # (json-repair) are real, user-facing install combinations, so
        # their dependencies must be in the audited set too — not just
        # the dev/test toolchain.
        run: uv export --frozen --no-emit-project --no-hashes --all-extras --format requirements-txt -o requirements-audit.txt

      - name: pip-audit (requirements)
        # Audits the exported requirements file. `--strict` fails the
        # build on any skipped dependency; because we exported without
        # the editable project, there is nothing to skip.
        run: uv run --with pip-audit pip-audit --strict -r requirements-audit.txt

      - name: OSV-Scanner (lockfile mode)
        # 2026-04-25: bumped from v1.9.1 → v2.3.5. The v1.9.x line started
        # returning 'Pull down action image ... ghcr.io/google/osv-scanner-
        # action:v1.9.1' / 'Docker pull failed' on fresh CI runs, suggesting
        # the v1.x docker images on GHCR have rotated out. v2.x ships the
        # scanner binary inline so docker-pull is no longer in the loop;
        # the `scan-args` input is unchanged.
        uses: google/osv-scanner-action/osv-scanner-action@c51854704019a247608d928f370c98740469d4b5 # v2.3.5
        with:
          scan-args: |-
            --lockfile=./uv.lock

  # -------------------------------------------------------------------
  # PR-only: block pulls that introduce a vulnerable dep *at PR time*,
  # so we catch the regression before it lands on main.
  # -------------------------------------------------------------------
  dependency-review:
    name: Dependency review (PR)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Dependency Review
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          # Fail on any new Critical/High severity finding introduced
          # by the PR. The cve-audit job re-checks the full installed
          # set on every push as a belt-and-braces backstop.
          fail-on-severity: high
